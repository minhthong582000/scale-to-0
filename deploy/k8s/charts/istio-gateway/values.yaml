gateway:
  name: istio-ingressgateway

  replicaCount: 1

  autoscaling:
    enabled: false

  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      cpu: null
      memory: 256Mi

  service:
    type: NodePort
    ports:
      - name: status-port
        port: 15021
        targetPort: 15021
        protocol: TCP
      - name: http2
        port: 80
        targetPort: 80
        nodePort: 30080
        protocol: TCP
      - name: https
        port: 443
        targetPort: 443
        nodePort: 30443
        protocol: TCP
